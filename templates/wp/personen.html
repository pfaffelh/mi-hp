{% extends config['skel_name'] %} {% block content %}
<style>
  /* Die Spalten einer Person oben bündig statt vertikal zentriert: links
     stehen Name und Namenszusatz, rechts oft Raum und Kommentar. */
  .mi-personen td { vertical-align: top; }
  /* Namenszusatz wenig eingerückt unter dem Namen. */
  .mi-personen .mi-namenszusatz { padding-left: 1.2em; }
  /* Mobil steht alles untereinander; Zellen ohne Telefon bzw. ohne Raum und
     Kommentar fallen dabei ganz weg. */
  @media (max-width: 600px) {
    .mi-personen table,
    .mi-personen tbody,
    .mi-personen tr,
    .mi-personen td { display: block; width: 100%; }
    .mi-personen td { border: none; padding: 0; }
    .mi-personen td:empty { display: none; }
    .mi-personen tr { padding: 0.6em 0; border-bottom: 1px solid #ddd; }
  }
</style>
<div style="display:flex; flex-direction:row; flex-wrap:wrap; gap:12px; align-items:center;">

{% for k1 in data %} 

  <a href="#{{k1['gruppe']}}"
     style="display:inline-flex; align-items:center; justify-content:center;
            padding:5px 9px; border:2px solid #000; text-decoration:none;">
    {{ k1["gruppe"]|markdown }}
  </a>
{% endfor %}
</div>

<br>
<br>
<br>

<h3 class="wp-block-heading">
  <h1>{{ config['titel'] }}</h1>
</h3>

<div
  class="[&amp;&gt;*]:bl-relative last:[&amp;&gt;*.bl-absolute]:bl-absolute [&amp;&gt;*]:bl-z-20 last:[&amp;&gt;*]:bl-z-10 bl-relative bl-overflow-x-clip [.wp-block-ufr-section_&amp;]:bl-overflow-x-visible bl-bg-transparent bl-text-inherit dark:bl-bg-transparent dark:bl-text-inherit alignfull wp-block-ufr-section has-global-padding is-layout-constrained wp-block-section-is-layout-constrained"
>
  {% for k1 in data %} 

<h3 id = "{{ k1['gruppe']}}"" class="wp-block-heading">{{ k1["gruppe"]|markdown }}</h3>
  <h4
    class="wp-block-heading has-text-align-left"
    id="block-0d8febea-81f3-4fa4-b1cc-8bee832ee085"
  >
  </h4>
  <figure class="wp-block-table mi-personen">
    <table class="has-fixed-layout">
      <tbody>
        {% for p in k1["members"] %}
        <tr>
          <td>
        {{ p["name"] | safe }}
            {% for m in p["mails"] %}<a href="mailto:{{ m }}" title="{{ m }}"> ✉</a>{% endfor %}
            {% if p["namenszusatz"] %}
            <div class="mi-namenszusatz">{{ p["namenszusatz"] }}</div>
            {% endif %}
          </td>
          <td>{% if p["tel"] %}Tel: {{ p["tel"] }}{% endif %}</td>
          <td>{% if p["raum"] %}Raum {{ p["raum"] }}{% endif %}{% if p["raum"] and p["kommentar"] %}<br>{% endif %}{% if p["kommentar"] %}{{ p["kommentar"] }}{% endif %}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </figure>
  {% endfor %}
</div>

{% endblock %}
